<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Control de Ingreso</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
    }

    body {
      text-align: center;
      padding: 25px 15px;
    }

    .contenedor {
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
    }

    h1 {
      color: #20b15a;
      font-size: 28px;
      margin: 20px 0 5px;
    }

    .subtitulo {
      color: #ccc;
      font-size: 15px;
      margin-bottom: 25px;
    }

    #estado {
      background: #222;
      padding: 18px;
      border-radius: 12px;
      margin: 20px 0;
      font-size: 17px;
      line-height: 1.5;
    }

    #reader {
      width: 100%;
      margin: 20px auto;
      overflow: hidden;
      border-radius: 14px;
      background: #222;
    }

    .verde {
      color: #20b15a;
      font-weight: bold;
    }

    .rojo {
      color: #e53935;
      font-weight: bold;
    }

    .boton {
      display: block;
      width: 100%;
      max-width: 420px;
      margin: 20px auto;
      padding: 20px 15px;
      border: 0;
      border-radius: 12px;
      background: #20b15a;
      color: white;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
    }

    #activarCamara {
      display: none;
    }

    .ayuda {
      color: #bbb;
      font-size: 15px;
      line-height: 1.5;
      margin: 20px auto;
    }
  </style>
</head>

<body>

  <div class="contenedor">

    <h1>CONTROL DE INGRESO</h1>

    <div class="subtitulo">
      CADENA PERPETUA
    </div>

    <div id="estado">
      Preparando cámara...
    </div>

    <div id="reader"></div>

    <button
      id="activarCamara"
      class="boton"
      onclick="activarCamaraManual()"
    >
      ACTIVAR CÁMARA
    </button>

    <div class="ayuda" id="ayuda"></div>

  </div>


<script>

const URL_APPS_SCRIPT =
  "https://script.google.com/macros/s/AKfycbwqJQAoFyiz2GP7n05ATXvtPiCWChRzScyqCz3OIB1xmY14F5jKc8U898wcfZrZfQAMPQ/exec";

const CLAVE = "P1-TEST-9264";

let scanner = null;
let procesando = false;


// ============================================================
// EXTRAER CODIGO DEL QR
// ============================================================

function extraerCodigo(texto) {

  texto = String(texto || "").trim();

  if (!texto) {
    return "";
  }

  try {

    const url = new URL(texto);

    const codigo =
      url.searchParams.get("codigo");

    if (codigo) {
      return codigo.trim();
    }

  } catch (e) {
  }

  return texto;
}


// ============================================================
// MOSTRAR ESTADO
// ============================================================

function mostrarEstado(texto, clase) {

  const estado =
    document.getElementById("estado");

  estado.innerHTML =
    "<span class='" +
    clase +
    "'>" +
    texto +
    "</span>";
}


// ============================================================
// INICIAR LECTOR
// ============================================================

function iniciarScanner() {

  procesando = false;

  document.getElementById(
    "activarCamara"
  ).style.display = "none";

  document.getElementById(
    "ayuda"
  ).innerHTML = "";

  mostrarEstado(
    "INICIANDO CÁMARA...",
    "verde"
  );

  try {

    scanner =
      new Html5QrcodeScanner(
        "reader",
        {
          fps: 10,

          qrbox: {
            width: 250,
            height: 250
          },

          rememberLastUsedCamera: true,

          supportedScanTypes: [
            Html5QrcodeScanType.SCAN_TYPE_CAMERA
          ]
        },
        false
      );

    scanner.render(
      qrDetectado,
      errorLectura
    );

  } catch (error) {

    mostrarErrorCamara();

  }
}


// ============================================================
// QR DETECTADO
// ============================================================

function qrDetectado(
  decodedText,
  decodedResult
) {

  if (procesando) {
    return;
  }

  procesando = true;

  const codigo =
    extraerCodigo(decodedText);

  if (!codigo) {

    procesando = false;

    mostrarEstado(
      "QR NO VÁLIDO",
      "rojo"
    );

    return;
  }


  mostrarEstado(
    "QR DETECTADO: " +
    escapar(codigo),
    "verde"
  );


  // Ir a Apps Script para controlar la entrada

  const destino =
    URL_APPS_SCRIPT +
    "?codigo=" +
    encodeURIComponent(codigo) +
    "&clave=" +
    encodeURIComponent(CLAVE);


  window.location.href =
    destino;
}


// ============================================================
// ERRORES DEL LECTOR
// ============================================================

function errorLectura(errorMessage) {

  const mensaje =
    String(errorMessage || "");

  if (
    mensaje.indexOf("NotAllowedError") !== -1 ||
    mensaje.indexOf("Permission denied") !== -1
  ) {

    mostrarErrorCamara();
  }
}


// ============================================================
// CAMARA BLOQUEADA
// ============================================================

function mostrarErrorCamara() {

  mostrarEstado(
    "SE NECESITA ACCESO A LA CÁMARA",
    "rojo"
  );

  document.getElementById(
    "activarCamara"
  ).style.display = "block";

  document.getElementById(
    "ayuda"
  ).innerHTML =
    "Tocá ACTIVAR CÁMARA y permití el acceso cuando Chrome lo solicite.";
}


// ============================================================
// ACTIVAR MANUALMENTE
// ============================================================

function activarCamaraManual() {

  document.getElementById(
    "activarCamara"
  ).style.display = "none";

  document.getElementById(
    "reader"
  ).innerHTML = "";

  mostrarEstado(
    "SOLICITANDO CÁMARA...",
    "verde"
  );

  iniciarScanner();
}


// ============================================================
// ESCAPAR TEXTO
// ============================================================

function escapar(texto) {

  return String(texto || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;");
}


// ============================================================
// INICIO
// ============================================================

window.addEventListener(
  "load",
  function() {

    setTimeout(
      iniciarScanner,
      500
    );

  }
);

</script>

</body>
</html>
