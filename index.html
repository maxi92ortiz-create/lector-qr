<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Control de Ingreso</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
    }

    body {
      text-align: center;
      padding: 30px 20px;
    }

    .contenedor {
      width: 100%;
      max-width: 650px;
      margin: 0 auto;
    }

    h1 {
      color: #20b15a;
      font-size: 30px;
      margin: 20px 0 5px;
    }

    .subtitulo {
      font-size: 18px;
      margin-bottom: 35px;
    }

    .estado {
      background: #222;
      padding: 22px;
      border-radius: 12px;
      margin-bottom: 25px;
    }

    .estado strong {
      display: block;
      color: #20b15a;
      font-size: 21px;
      margin-bottom: 8px;
    }

    #reader {
      width: 100%;
      overflow: hidden;
      border-radius: 14px;
      background: #222;
    }

    #reader video {
      width: 100% !important;
      border-radius: 14px;
    }

    #mensaje {
      margin-top: 25px;
      font-size: 17px;
      line-height: 1.4;
    }

    .error {
      color: #ff5252;
    }

    .ok {
      color: #20b15a;
    }
  </style>
</head>

<body>

  <div class="contenedor">

    <h1>CONTROL DE INGRESO</h1>

    <div class="subtitulo">
      CADENA PERPETUA
    </div>

    <div class="estado">
      <strong id="estadoTexto">
        INICIANDO CÁMARA...
      </strong>

      <span>
        Apunte al QR de la invitación.
      </span>
    </div>

    <div id="reader"></div>

    <div id="mensaje"></div>

  </div>


  <script>

    // ========================================================
    // CONFIGURACIÓN
    // ========================================================

    const URL_APP =
      "https://script.google.com/macros/s/AKfycbwqJQAoFyiz2GP7n05ATXvtPiCWChRzScyqCz3OlB1xmY14F5jKc8U898wcfZrZfQAMPQ/exec";

    const CLAVE =
      "P1-TEST-9264";


    let procesando = false;


    // ========================================================
    // EXTRAER CÓDIGO DEL QR
    // ========================================================

    function obtenerCodigo(texto) {

      texto = String(texto || "").trim();

      if (!texto) {
        return "";
      }


      // ------------------------------------------------------
      // SI EL QR CONTIENE UNA URL
      // ------------------------------------------------------

      try {

        const url = new URL(texto);

        const codigoURL =
          url.searchParams.get("codigo");

        if (codigoURL) {

          return codigoURL.trim();

        }

      } catch (e) {

        // No es una URL.
        // Seguimos y lo tratamos como código directo.

      }


      // ------------------------------------------------------
      // QR CON CÓDIGO DIRECTO
      // EJEMPLO: TEST-004
      // ------------------------------------------------------

      return texto;
    }


    // ========================================================
    // QR LEÍDO
    // ========================================================

    function qrLeido(
      decodedText,
      decodedResult
    ) {

      if (procesando) {
        return;
      }


      const codigo =
        obtenerCodigo(decodedText);


      if (!codigo) {

        document.getElementById("mensaje").innerHTML =
          "<span class='error'>QR sin código válido.</span>";

        return;
      }


      procesando = true;


      document.getElementById("estadoTexto").textContent =
        "QR DETECTADO";


      document.getElementById("mensaje").innerHTML =
        "<span class='ok'>Código: " +
        escapar(codigo) +
        "</span><br>Verificando invitación...";


      // ======================================================
      // CREAR URL CORRECTA HACIA APPS SCRIPT
      // ======================================================

      const destino =
        URL_APP +
        "?codigo=" +
        encodeURIComponent(codigo) +
        "&clave=" +
        encodeURIComponent(CLAVE);


      // ======================================================
      // IR A CONTROL DE INGRESO
      // ======================================================

      setTimeout(function () {

        window.location.href = destino;

      }, 300);

    }


    // ========================================================
    // ERROR DEL ESCÁNER
    // ========================================================

    function errorLectura(errorMessage) {

      // Los errores normales mientras busca un QR
      // se ignoran para que no molesten en pantalla.

    }


    // ========================================================
    // PROTEGER TEXTO
    // ========================================================

    function escapar(texto) {

      return String(texto)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }


    // ========================================================
    // INICIAR ESCÁNER
    // ========================================================

    function iniciarScanner() {

      document.getElementById("estadoTexto").textContent =
        "CÁMARA ACTIVA";


      const scanner =
        new Html5QrcodeScanner(
          "reader",
          {
            fps: 10,

            qrbox: {
              width: 250,
              height: 250
            },

            rememberLastUsedCamera: true,

            supportedScanTypes: [
              Html5QrcodeScanType.SCAN_TYPE_CAMERA
            ]
          },
          false
        );


      scanner.render(
        qrLeido,
        errorLectura
      );
    }


    // ========================================================
    // ARRANCAR
    // ========================================================

    window.addEventListener(
      "load",
      iniciarScanner
    );

  </script>

</body>
</html>
