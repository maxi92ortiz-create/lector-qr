<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Control de Ingreso</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background: #111;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    body {
      text-align: center;
      padding: 25px 15px;
    }

    .contenedor {
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
    }

    h1 {
      color: #20b15a;
      font-size: 28px;
      margin: 15px 0 10px;
    }

    .subtitulo {
      font-size: 16px;
      color: #ddd;
      margin-bottom: 25px;
    }

    #reader {
      width: 100%;
      max-width: 500px;
      margin: 20px auto;
      background: #222;
      border-radius: 14px;
      overflow: hidden;
    }

    #estado {
      margin: 20px auto;
      padding: 18px;
      border-radius: 12px;
      background: #222;
      font-size: 18px;
      line-height: 1.5;
    }

    .verde {
      color: #20b15a;
      font-weight: bold;
    }

    .rojo {
      color: #e53935;
      font-weight: bold;
    }

    .boton {
      width: 100%;
      max-width: 420px;
      border: 0;
      border-radius: 12px;
      padding: 20px;
      margin: 15px auto;
      background: #20b15a;
      color: white;
      font-size: 19px;
      font-weight: bold;
      cursor: pointer;
    }

    .boton:disabled {
      opacity: 0.5;
    }

    #resultado {
      display: none;
      margin-top: 20px;
    }

    .tarjeta {
      padding: 25px 18px;
      border-radius: 14px;
      background: #1b1b1b;
    }

    .codigo {
      font-size: 27px;
      font-weight: bold;
      margin: 20px 0;
      word-break: break-word;
    }

    .mensajeGrande {
      font-size: 25px;
      font-weight: bold;
      margin: 20px 0;
    }

    iframe {
      width: 100%;
      height: 430px;
      border: 0;
      border-radius: 12px;
      background: #111;
    }
  </style>
</head>

<body>

  <div class="contenedor">

    <h1>CONTROL DE INGRESO</h1>

    <div class="subtitulo">
      CADENA PERPETUA
    </div>

    <div id="zonaScanner">

      <div id="estado">
        Preparando cámara...
      </div>

      <div id="reader"></div>

    </div>

    <div id="resultado">

      <div class="tarjeta">

        <div id="textoResultado">
          Procesando invitación...
        </div>

        <button
          class="boton"
          id="btnVolver"
          onclick="volverScanner()"
        >
          ESCANEAR SIGUIENTE
        </button>

      </div>

    </div>

  </div>


<script>

  // =========================================================
  // CONFIGURACIÓN
  // =========================================================

  const URL_APPS_SCRIPT =
    "https://script.google.com/macros/s/AKfycbwqJQAoFyiz2GP7n05ATXvtPiCWChRzScyqCz3OIB1xmY14F5jKc8U898wcfZrZfQAMPQ/exec";

  const CLAVE =
    "P1-TEST-9264";


  // =========================================================
  // VARIABLES
  // =========================================================

  let scanner = null;

  let bloqueado = false;


  // =========================================================
  // EXTRAER CÓDIGO DEL QR
  // =========================================================

  function extraerCodigo(textoQR) {

    textoQR = String(textoQR || "").trim();

    if (!textoQR) {
      return "";
    }

    // Si el QR contiene la URL completa de Apps Script
    try {

      const url = new URL(textoQR);

      const codigoURL =
        url.searchParams.get("codigo");

      if (codigoURL) {
        return codigoURL.trim();
      }

    } catch (e) {
      // No era una URL. Continuamos.
    }

    // Si el QR contiene solamente TEST-004, INV-001, etc.
    return textoQR;
  }


  // =========================================================
  // INICIAR CÁMARA
  // =========================================================

  function iniciarScanner() {

    bloqueado = false;

    document.getElementById("resultado").style.display =
      "none";

    document.getElementById("zonaScanner").style.display =
      "block";

    document.getElementById("estado").innerHTML =
      "<span class='verde'>CÁMARA ACTIVA</span><br>" +
      "Apunte al QR de la invitación.";

    if (scanner) {

      try {
        scanner.clear();
      } catch (e) {
      }

    }

    scanner =
      new Html5QrcodeScanner(
        "reader",
        {
          fps: 10,

          qrbox: {
            width: 250,
            height: 250
          },

          rememberLastUsedCamera: true,

          supportedScanTypes: [
            Html5QrcodeScanType.SCAN_TYPE_CAMERA
          ]
        },
        false
      );

    scanner.render(
      qrLeido,
      errorScanner
    );
  }


  // =========================================================
  // QR LEÍDO
  // =========================================================

  function qrLeido(textoQR) {

    if (bloqueado) {
      return;
    }

    bloqueado = true;

    const codigo =
      extraerCodigo(textoQR);

    if (!codigo) {

      bloqueado = false;

      document.getElementById("estado").innerHTML =
        "<span class='rojo'>QR NO VÁLIDO</span>";

      return;
    }

    document.getElementById("estado").innerHTML =
      "<span class='verde'>QR DETECTADO</span><br>" +
      escapar(codigo);

    // Detenemos la cámara
    if (scanner) {

      scanner
        .clear()
        .catch(function() {});

    }

    consultarInvitacion(codigo);
  }


  // =========================================================
  // CONSULTAR APPS SCRIPT
  // =========================================================

  function consultarInvitacion(codigo) {

    document.getElementById("zonaScanner").style.display =
      "none";

    document.getElementById("resultado").style.display =
      "block";

    document.getElementById("textoResultado").innerHTML =
      "<div class='mensajeGrande verde'>" +
      "VERIFICANDO..." +
      "</div>" +
      "<div class='codigo'>" +
      escapar(codigo) +
      "</div>";

    const destino =
      URL_APPS_SCRIPT +
      "?codigo=" +
      encodeURIComponent(codigo) +
      "&clave=" +
      encodeURIComponent(CLAVE);

    // Abrimos Apps Script en la misma pantalla.
    // Allí aparecerá INVITACIÓN VÁLIDA o YA UTILIZADA.
    window.location.href = destino;
  }


  // =========================================================
  // VOLVER AL ESCÁNER
  // =========================================================

  function volverScanner() {

    window.location.href =
      window.location.origin +
      window.location.pathname;
  }


  // =========================================================
  // ERROR NORMAL DEL LECTOR
  // =========================================================

  function errorScanner(error) {

    // No hacemos nada.
    // html5-qrcode genera errores mientras busca un QR.
    // Eso es normal.
  }


  // =========================================================
  // SEGURIDAD PARA MOSTRAR TEXTO
  // =========================================================

  function escapar(texto) {

    return String(texto || "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }


  // =========================================================
  // ARRANQUE AUTOMÁTICO
  // =========================================================

  window.addEventListener(
    "load",
    function() {

      iniciarScanner();

    }
  );

</script>

</body>
</html>
