<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
  >

  <title>Control de Ingreso</title>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background: #111;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    body {
      text-align: center;
      padding: 30px 20px;
    }

    .contenedor {
      width: 100%;
      max-width: 650px;
      margin: 0 auto;
    }

    h1 {
      color: #20b15a;
      font-size: 30px;
      margin: 20px 0 5px;
    }

    .subtitulo {
      font-size: 18px;
      margin-bottom: 35px;
    }

    .estado {
      background: #222;
      padding: 22px;
      border-radius: 14px;
      margin-bottom: 25px;
    }

    .estado strong {
      display: block;
      color: #20b15a;
      font-size: 21px;
      margin-bottom: 8px;
    }

    .estado span {
      font-size: 17px;
    }

    #reader {
      width: 100%;
      overflow: hidden;
      border-radius: 14px;
      background: #222;
      display: none;
    }

    #reader video {
      width: 100% !important;
      border-radius: 14px;
    }

    #mensaje {
      margin-top: 25px;
      font-size: 17px;
      line-height: 1.5;
    }

    .ok {
      color: #20b15a;
      font-weight: bold;
    }

    .error {
      color: #ff5252;
      font-weight: bold;
    }

    #activarCamara {
      display: block;
      width: 100%;
      max-width: 500px;

      margin: 30px auto;

      padding: 22px 15px;

      border: 0;
      border-radius: 14px;

      background: #20b15a;
      color: white;

      font-size: 22px;
      font-weight: bold;

      cursor: pointer;
    }

    #activarCamara:disabled {
      opacity: 0.6;
    }

  </style>

</head>


<body>

  <div class="contenedor">

    <h1>
      CONTROL DE INGRESO
    </h1>

    <div class="subtitulo">
      CADENA PERPETUA
    </div>


    <div class="estado">

      <strong id="estadoTexto">
        LISTO PARA ESCANEAR
      </strong>

      <span id="estadoDetalle">
        Presione el botón para activar la cámara.
      </span>

    </div>


    <button
      id="activarCamara"
      type="button"
    >
      ACTIVAR CÁMARA
    </button>


    <div id="reader"></div>


    <div id="mensaje"></div>

  </div>



  <script>

    // =========================================================
    // CONFIGURACIÓN
    // =========================================================

    const URL_APP =
      "https://script.google.com/macros/s/AKfycbwqJQAoFyiz2GP7n05ATXvtPiCWChRzScyqCz3OlB1xmY14F5jKc8U898wcfZrZfQAMPQ/exec";


    const CLAVE =
      "P1-TEST-9264";


    let scanner = null;

    let procesando = false;

    let camaraActiva = false;



    // =========================================================
    // ELEMENTOS
    // =========================================================

    const boton =
      document.getElementById("activarCamara");


    const reader =
      document.getElementById("reader");


    const mensaje =
      document.getElementById("mensaje");


    const estadoTexto =
      document.getElementById("estadoTexto");


    const estadoDetalle =
      document.getElementById("estadoDetalle");



    // =========================================================
    // ESCAPAR TEXTO
    // =========================================================

    function escapar(texto) {

      return String(texto || "")

        .replace(/&/g, "&amp;")

        .replace(/</g, "&lt;")

        .replace(/>/g, "&gt;")

        .replace(/"/g, "&quot;")

        .replace(/'/g, "&#039;");
    }



    // =========================================================
    // OBTENER CÓDIGO DEL QR
    // =========================================================

    function obtenerCodigo(texto) {

      texto =
        String(texto || "").trim();


      if (!texto) {

        return "";

      }


      // -------------------------------------------------------
      // SI EL QR CONTIENE UNA URL
      // -------------------------------------------------------

      try {

        const url =
          new URL(texto);


        const codigo =
          url.searchParams.get("codigo");


        if (codigo) {

          return codigo.trim();

        }

      }

      catch (error) {

        // Si no es una URL,
        // se considera código directo.

      }


      // -------------------------------------------------------
      // EJEMPLO:
      // TEST-004
      // -------------------------------------------------------

      return texto;
    }



    // =========================================================
    // CUANDO DETECTA UN QR
    // =========================================================

    async function qrLeido(
      decodedText,
      decodedResult
    ) {


      // Evita que lea el mismo QR varias veces

      if (procesando) {

        return;

      }


      const codigo =
        obtenerCodigo(decodedText);


      if (!codigo) {

        mensaje.innerHTML =
          "<span class='error'>" +
          "QR SIN CÓDIGO VÁLIDO" +
          "</span>";

        return;

      }


      procesando = true;



      // -------------------------------------------------------
      // MOSTRAR RESULTADO
      // -------------------------------------------------------

      estadoTexto.textContent =
        "QR DETECTADO";


      estadoDetalle.textContent =
        "Verificando invitación...";


      mensaje.innerHTML =

        "<span class='ok'>" +

        "Código: " +

        escapar(codigo) +

        "</span>";



      // -------------------------------------------------------
      // DETENER CÁMARA
      // -------------------------------------------------------

      try {

        if (
          scanner &&
          camaraActiva
        ) {

          await scanner.stop();

          camaraActiva = false;

        }

      }

      catch (error) {

        console.log(
          "No fue necesario detener cámara",
          error
        );

      }



      // -------------------------------------------------------
      // CREAR URL DE VALIDACIÓN
      // -------------------------------------------------------

      const destino =

        URL_APP +

        "?codigo=" +

        encodeURIComponent(codigo) +

        "&clave=" +

        encodeURIComponent(CLAVE);



      // -------------------------------------------------------
      // IR AL CONTROL DE APPS SCRIPT
      // -------------------------------------------------------

      window.location.href =
        destino;
    }



    // =========================================================
    // ERROR NORMAL DURANTE ESCANEO
    // =========================================================

    function errorLectura(errorMessage) {

      // No mostrar nada.
      //
      // La librería genera errores continuamente
      // mientras todavía no encuentra un QR.

    }



    // =========================================================
    // ACTIVAR CÁMARA
    // =========================================================

    async function activarCamara() {


      if (camaraActiva) {

        return;

      }


      procesando = false;


      boton.disabled = true;


      boton.textContent =
        "ACTIVANDO CÁMARA...";


      estadoTexto.textContent =
        "INICIANDO CÁMARA...";


      estadoDetalle.textContent =
        "Espere un momento.";


      mensaje.innerHTML = "";



      // -------------------------------------------------------
      // COMPROBAR LIBRERÍA
      // -------------------------------------------------------

      if (
        typeof Html5Qrcode === "undefined"
      ) {


        estadoTexto.textContent =
          "ERROR DEL LECTOR";


        estadoDetalle.textContent =
          "No se cargó el lector QR.";


        mensaje.innerHTML =

          "<span class='error'>" +

          "Recargue la página e intente nuevamente." +

          "</span>";


        boton.disabled = false;


        boton.textContent =
          "REINTENTAR";


        return;
      }



      // -------------------------------------------------------
      // MOSTRAR CONTENEDOR
      // -------------------------------------------------------

      reader.style.display =
        "block";



      try {


        // -----------------------------------------------------
        // CREAR LECTOR
        // -----------------------------------------------------

        scanner =
          new Html5Qrcode(
            "reader"
          );



        // -----------------------------------------------------
        // CONFIGURACIÓN
        // -----------------------------------------------------

        const configuracion = {

          fps: 10,

          qrbox: function(
            viewfinderWidth,
            viewfinderHeight
          ) {

            const minimo =
              Math.min(
                viewfinderWidth,
                viewfinderHeight
              );


            const tamano =
              Math.floor(
                minimo * 0.70
              );


            return {

              width: tamano,

              height: tamano

            };

          }

        };



        // =====================================================
        // IMPORTANTE
        //
        // ESTA ES LA CORRECCIÓN DEL ERROR:
        //
        // facingMode ES STRING
        // NO USAMOS "ideal"
        // =====================================================

        await scanner.start(

          {
            facingMode: "environment"
          },

          configuracion,

          qrLeido,

          errorLectura

        );



        // -----------------------------------------------------
        // CÁMARA FUNCIONANDO
        // -----------------------------------------------------

        camaraActiva = true;


        estadoTexto.textContent =
          "CÁMARA ACTIVA";


        estadoDetalle.textContent =
          "Apunte al QR de la invitación.";


        boton.style.display =
          "none";


        mensaje.innerHTML = "";



      }

      catch (error) {


        console.error(error);


        camaraActiva = false;


        reader.style.display =
          "none";


        estadoTexto.textContent =
          "NO SE PUDO ABRIR LA CÁMARA";


        estadoDetalle.textContent =
          "Error al iniciar el lector.";


        mensaje.innerHTML =

          "<span class='error'>" +

          escapar(

            error && error.message

              ? error.message

              : String(error)

          ) +

          "</span>";


        boton.disabled = false;


        boton.style.display =
          "block";


        boton.textContent =
          "REINTENTAR CÁMARA";

      }

    }



    // =========================================================
    // BOTÓN ACTIVAR
    // =========================================================

    boton.addEventListener(

      "click",

      activarCamara

    );



    // =========================================================
    // CUANDO SE REGRESA A ESTA PÁGINA
    // =========================================================

    window.addEventListener(

      "pageshow",

      function () {


        procesando = false;


        if (!camaraActiva) {


          estadoTexto.textContent =
            "LISTO PARA ESCANEAR";


          estadoDetalle.textContent =
            "Presione el botón para activar la cámara.";


          boton.disabled = false;


          boton.style.display =
            "block";


          boton.textContent =
            "ACTIVAR CÁMARA";

        }

      }

    );

  </script>

</body>

</html>
