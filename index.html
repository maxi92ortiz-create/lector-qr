<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
  >

  <title>Control de Ingreso - Cadena Perpetua</title>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background: #111;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    body {
      padding: 24px 16px;
      text-align: center;
    }

    .contenedor {
      width: 100%;
      max-width: 650px;
      margin: 0 auto;
    }

    h1 {
      margin: 18px 0 6px;
      color: #20b15a;
      font-size: 30px;
      font-weight: 700;
    }

    .subtitulo {
      margin-bottom: 24px;
      font-size: 18px;
    }


    /* ========================================================
       CONTADORES
       ======================================================== */

    .estadisticas {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin: 0 0 22px;
    }

    .contador {
      background: #222;
      border: 1px solid #333;
      border-radius: 12px;
      padding: 14px 5px;
      min-width: 0;
    }

    .contadorNumero {
      display: block;
      font-size: 28px;
      line-height: 1;
      font-weight: 900;
      margin-bottom: 8px;
    }

    .contadorTitulo {
      display: block;
      font-size: 10px;
      font-weight: bold;
      color: #aaa;
      letter-spacing: .4px;
    }

    #numeroDescargadas {
      color: #fff;
    }

    #numeroEscaneadas {
      color: #20b15a;
    }

    #numeroQuedan {
      color: #ffca28;
    }

    .actualizando {
      color: #777;
      font-size: 11px;
      margin: -12px 0 20px;
      min-height: 14px;
    }


    /* ========================================================
       ESTADO DEL LECTOR
       ======================================================== */

    .estado {
      margin-bottom: 25px;
      padding: 24px 20px;
      background: #222;
      border-radius: 14px;
    }

    .estado strong {
      display: block;
      margin-bottom: 8px;
      color: #20b15a;
      font-size: 21px;
    }

    .estado span {
      font-size: 17px;
      line-height: 1.4;
    }


    /* ========================================================
       CÁMARA
       ======================================================== */

    #reader {
      display: none;
      width: 100%;
      overflow: hidden;
      background: #222;
      border-radius: 14px;
    }

    #reader video {
      width: 100% !important;
      height: auto !important;
      border-radius: 14px;
    }

    #activarCamara {
      display: block;
      width: 100%;
      max-width: 500px;
      margin: 30px auto;
      padding: 22px 15px;

      border: 0;
      border-radius: 14px;

      background: #20b15a;
      color: #fff;

      font-size: 22px;
      font-weight: bold;

      cursor: pointer;
    }

    #activarCamara:disabled {
      opacity: 0.6;
    }

    #mensaje {
      margin-top: 24px;
      font-size: 17px;
      line-height: 1.5;
    }

    .ok {
      color: #20b15a;
      font-weight: bold;
    }

    .error {
      color: #ff5252;
      font-weight: bold;
    }

    .info {
      color: #ddd;
    }


    /* ========================================================
       CELULARES MUY CHICOS
       ======================================================== */

    @media (max-width: 370px) {

      .contadorNumero {
        font-size: 23px;
      }

      .contadorTitulo {
        font-size: 8px;
      }

      .contador {
        padding: 12px 3px;
      }
    }

  </style>
</head>


<body>

  <div class="contenedor">

    <h1>CONTROL DE INGRESO</h1>

    <div class="subtitulo">
      CADENA PERPETUA
    </div>


    <!-- ======================================================
         ESTADÍSTICAS
         ====================================================== -->

    <div class="estadisticas">

      <div class="contador">

        <span
          id="numeroDescargadas"
          class="contadorNumero"
        >
          —
        </span>

        <span class="contadorTitulo">
          DESCARGADAS
        </span>

      </div>


      <div class="contador">

        <span
          id="numeroEscaneadas"
          class="contadorNumero"
        >
          —
        </span>

        <span class="contadorTitulo">
          ESCANEADAS
        </span>

      </div>


      <div class="contador">

        <span
          id="numeroQuedan"
          class="contadorNumero"
        >
          —
        </span>

        <span class="contadorTitulo">
          QUEDAN
        </span>

      </div>

    </div>

    <div
      id="estadoEstadisticas"
      class="actualizando"
    >
      Actualizando información...
    </div>


    <!-- ======================================================
         ESTADO
         ====================================================== -->

    <div class="estado">

      <strong id="estadoTexto">
        LISTO PARA ESCANEAR
      </strong>

      <span id="estadoDetalle">
        Presione ACTIVAR CÁMARA para comenzar.
      </span>

    </div>


    <!-- ======================================================
         CÁMARA
         ====================================================== -->

    <button
      id="activarCamara"
      type="button"
    >
      ACTIVAR CÁMARA
    </button>

    <div id="reader"></div>

    <div id="mensaje"></div>

  </div>


  <script>

    // =========================================================
    // CONFIGURACIÓN
    // =========================================================

    const URL_APP =
      "https://script.google.com/macros/s/AKfycbwqJQAoFyiz2GP7n05ATXvtPiCWChRzScyqCz3OlB1xmY14F5jKc8U898wcfZrZfQAMPQ/exec";

    const CLAVE =
      "P1-TEST-9264";


    let scanner = null;

    let camaraActiva = false;

    let procesando = false;


    // =========================================================
    // ELEMENTOS
    // =========================================================

    const boton =
      document.getElementById("activarCamara");

    const reader =
      document.getElementById("reader");

    const mensaje =
      document.getElementById("mensaje");

    const estadoTexto =
      document.getElementById("estadoTexto");

    const estadoDetalle =
      document.getElementById("estadoDetalle");


    const numeroDescargadas =
      document.getElementById("numeroDescargadas");

    const numeroEscaneadas =
      document.getElementById("numeroEscaneadas");

    const numeroQuedan =
      document.getElementById("numeroQuedan");

    const estadoEstadisticas =
      document.getElementById("estadoEstadisticas");


    // =========================================================
    // ESTADÍSTICAS
    // =========================================================

    async function actualizarEstadisticas() {

      try {

        estadoEstadisticas.textContent =
          "Actualizando información...";


        const url =

          URL_APP +

          "?modo=estadisticas" +

          "&_=" +

          Date.now();


        const respuesta =
          await fetch(
            url,
            {
              cache: "no-store"
            }
          );


        if (!respuesta.ok) {

          throw new Error(
            "No se pudieron consultar los contadores."
          );
        }


        const datos =
          await respuesta.json();


        if (!datos.ok) {

          throw new Error(
            datos.error ||
            "No se pudieron consultar los contadores."
          );
        }


        numeroDescargadas.textContent =
          Number(
            datos.descargadas || 0
          ).toLocaleString("es-AR");


        numeroEscaneadas.textContent =
          Number(
            datos.escaneadas || 0
          ).toLocaleString("es-AR");


        numeroQuedan.textContent =
          Number(
            datos.quedan || 0
          ).toLocaleString("es-AR");


        estadoEstadisticas.textContent =
          "Datos actualizados";


      } catch (error) {

        console.error(
          "Error estadísticas:",
          error
        );


        estadoEstadisticas.textContent =
          "No se pudieron actualizar los contadores.";
      }
    }


    // =========================================================
    // ESCAPAR TEXTO
    // =========================================================

    function escapar(texto) {

      return String(
        texto == null
          ? ""
          : texto
      )

      .replace(/&/g, "&amp;")

      .replace(/</g, "&lt;")

      .replace(/>/g, "&gt;")

      .replace(/"/g, "&quot;")

      .replace(/'/g, "&#039;");
    }


    // =========================================================
    // EXTRAER CÓDIGO
    // =========================================================

    function obtenerCodigo(texto) {

      texto =
        String(
          texto || ""
        ).trim();


      if (!texto) {

        return "";
      }


      // -------------------------------------------------------
      // QR QUE CONTIENE URL
      // -------------------------------------------------------

      try {

        const url =
          new URL(texto);


        const codigo =
          url.searchParams.get(
            "codigo"
          );


        if (codigo) {

          return codigo.trim();
        }

      } catch (error) {

        // No es URL.
        // Se procesa como código directo.
      }


      // -------------------------------------------------------
      // QR DIRECTO
      // -------------------------------------------------------

      return texto;
    }


    // =========================================================
    // BUSCAR LA MEJOR CÁMARA
    // =========================================================

    function elegirCamara(camaras) {

      if (
        !camaras ||
        camaras.length === 0
      ) {

        return null;
      }


      const palabrasTrasera = [

        "back",

        "rear",

        "environment",

        "trasera",

        "posterior"
      ];


      for (
        let i = 0;
        i < camaras.length;
        i++
      ) {

        const etiqueta =
          String(
            camaras[i].label || ""
          ).toLowerCase();


        for (
          let j = 0;
          j < palabrasTrasera.length;
          j++
        ) {

          if (
            etiqueta.includes(
              palabrasTrasera[j]
            )
          ) {

            return camaras[i];
          }
        }
      }


      if (
        camaras.length > 1
      ) {

        return camaras[
          camaras.length - 1
        ];
      }


      return camaras[0];
    }


    // =========================================================
    // QR DETECTADO
    // =========================================================

    async function qrLeido(
      decodedText,
      decodedResult
    ) {

      if (procesando) {

        return;
      }


      const codigo =
        obtenerCodigo(
          decodedText
        );


      if (!codigo) {

        mensaje.innerHTML =

          "<span class='error'>" +

          "QR SIN CÓDIGO VÁLIDO" +

          "</span>";

        return;
      }


      procesando = true;


      estadoTexto.textContent =
        "QR DETECTADO";


      estadoDetalle.textContent =
        "Verificando invitación...";


      mensaje.innerHTML =

        "<span class='ok'>" +

        "Código: " +

        escapar(codigo) +

        "</span>";


      // -------------------------------------------------------
      // DETENER CÁMARA
      // -------------------------------------------------------

      try {

        if (
          scanner &&
          camaraActiva
        ) {

          await scanner.stop();
        }

      } catch (error) {

        console.log(
          "Cámara detenida o no requería detenerse."
        );
      }


      camaraActiva = false;


      // -------------------------------------------------------
      // ARMAR DIRECCIÓN AL APPS SCRIPT
      // -------------------------------------------------------

      const destino =

        URL_APP +

        "?codigo=" +

        encodeURIComponent(
          codigo
        ) +

        "&clave=" +

        encodeURIComponent(
          CLAVE
        );


      // -------------------------------------------------------
      // ABRIR CONTROL DE INVITACIÓN
      // -------------------------------------------------------

      window.location.replace(
        destino
      );
    }


    // =========================================================
    // ERROR NORMAL DE LECTURA
    // =========================================================

    function errorLectura(
      errorMessage
    ) {

      // Los errores mientras busca QR
      // son normales y no se muestran.
    }


    // =========================================================
    // ACTIVAR CÁMARA
    // =========================================================

    async function activarCamara() {

      if (camaraActiva) {

        return;
      }


      procesando = false;


      boton.disabled = true;

      boton.textContent =
        "ACTIVANDO CÁMARA...";


      estadoTexto.textContent =
        "BUSCANDO CÁMARA...";


      estadoDetalle.textContent =
        "Espere un momento.";


      mensaje.innerHTML = "";


      // Actualizamos estadísticas también
      // al comenzar una sesión de escaneo.

      actualizarEstadisticas();


      if (
        typeof Html5Qrcode ===
        "undefined"
      ) {

        mostrarError(
          "No se pudo cargar la librería del lector QR."
        );

        return;
      }


      try {

        const camaras =
          await Html5Qrcode
            .getCameras();


        if (
          !camaras ||
          camaras.length === 0
        ) {

          throw new Error(
            "No se encontraron cámaras disponibles."
          );
        }


        const camara =
          elegirCamara(
            camaras
          );


        if (!camara) {

          throw new Error(
            "No se pudo seleccionar una cámara."
          );
        }


        estadoTexto.textContent =
          "INICIANDO CÁMARA...";


        estadoDetalle.textContent =

          camara.label

            ? "Cámara seleccionada: " +
              camara.label

            : "Preparando cámara trasera.";


        reader.style.display =
          "block";


        scanner =
          new Html5Qrcode(
            "reader"
          );


        const configuracion = {

          fps: 10,

          qrbox: function(
            viewfinderWidth,
            viewfinderHeight
          ) {

            const minimo =
              Math.min(
                viewfinderWidth,
                viewfinderHeight
              );


            let tamano =
              Math.floor(
                minimo * 0.70
              );


            if (
              tamano > 300
            ) {

              tamano = 300;
            }


            if (
              tamano < 180
            ) {

              tamano = 180;
            }


            return {

              width: tamano,

              height: tamano
            };
          }
        };


        await scanner.start(

          camara.id,

          configuracion,

          qrLeido,

          errorLectura
        );


        camaraActiva = true;


        estadoTexto.textContent =
          "CÁMARA ACTIVA";


        estadoDetalle.textContent =
          "Apunte al QR de la invitación.";


        boton.style.display =
          "none";


        mensaje.innerHTML = "";


      } catch (error) {

        console.error(
          error
        );


        mostrarError(

          error &&
          error.message

            ? error.message

            : String(error)
        );
      }
    }


    // =========================================================
    // MOSTRAR ERROR
    // =========================================================

    function mostrarError(
      error
    ) {

      camaraActiva = false;


      reader.style.display =
        "none";


      estadoTexto.textContent =
        "NO SE PUDO ABRIR LA CÁMARA";


      estadoDetalle.textContent =
        "Revise el mensaje que aparece debajo.";


      mensaje.innerHTML =

        "<span class='error'>" +

        escapar(error) +

        "</span>";


      boton.disabled = false;


      boton.style.display =
        "block";


      boton.textContent =
        "REINTENTAR CÁMARA";
    }


    // =========================================================
    // BOTÓN
    // =========================================================

    boton.addEventListener(
      "click",
      activarCamara
    );


    // =========================================================
    // AL ABRIR EL LECTOR
    // =========================================================

    document.addEventListener(
      "DOMContentLoaded",
      function() {

        actualizarEstadisticas();
      }
    );


    // =========================================================
    // ACTUALIZACIÓN PERIÓDICA
    // =========================================================
    //
    // Si hay varios lectores trabajando al mismo tiempo,
    // los contadores se refrescan aunque este teléfono
    // no haya realizado el último ingreso.
    // =========================================================

    setInterval(
      function() {

        actualizarEstadisticas();

      },
      10000
    );


    // =========================================================
    // CUANDO SE REGRESA AL LECTOR
    // =========================================================

    window.addEventListener(
      "pageshow",
      function() {

        procesando = false;


        // Fundamental:
        // después de confirmar un ingreso,
        // volvemos a consultar las estadísticas.

        actualizarEstadisticas();


        if (
          !camaraActiva
        ) {

          estadoTexto.textContent =
            "LISTO PARA ESCANEAR";


          estadoDetalle.textContent =
            "Presione ACTIVAR CÁMARA para comenzar.";


          boton.disabled = false;


          boton.style.display =
            "block";


          boton.textContent =
            "ACTIVAR CÁMARA";
        }
      }
    );

  </script>

</body>
</html>
