<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
  >

  <title>Control de Ingreso</title>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
    }

    body {
      text-align: center;
      padding: 30px 20px;
    }

    .contenedor {
      width: 100%;
      max-width: 650px;
      margin: 0 auto;
    }

    h1 {
      color: #20b15a;
      font-size: 30px;
      margin: 20px 0 5px;
    }

    .subtitulo {
      font-size: 18px;
      margin-bottom: 35px;
    }

    .estado {
      background: #222;
      padding: 22px;
      border-radius: 12px;
      margin-bottom: 25px;
    }

    .estado strong {
      display: block;
      color: #20b15a;
      font-size: 21px;
      margin-bottom: 8px;
    }

    #reader {
      width: 100%;
      min-height: 260px;
      overflow: hidden;
      border-radius: 14px;
      background: #222;
      display: none;
    }

    #reader video {
      width: 100% !important;
      border-radius: 14px;
    }

    #mensaje {
      margin-top: 25px;
      font-size: 17px;
      line-height: 1.5;
    }

    .error {
      color: #ff5252;
      font-weight: bold;
    }

    .ok {
      color: #20b15a;
      font-weight: bold;
    }

    #activarCamara {
      display: block;
      width: 100%;
      max-width: 420px;
      margin: 30px auto;
      padding: 22px 15px;

      border: none;
      border-radius: 12px;

      background: #20b15a;
      color: white;

      font-size: 21px;
      font-weight: bold;

      cursor: pointer;
    }

    #activarCamara:disabled {
      opacity: 0.6;
    }
  </style>
</head>

<body>

  <div class="contenedor">

    <h1>CONTROL DE INGRESO</h1>

    <div class="subtitulo">
      CADENA PERPETUA
    </div>

    <div class="estado">

      <strong id="estadoTexto">
        LISTO PARA ESCANEAR
      </strong>

      <span id="estadoDetalle">
        Presione el botón para activar la cámara.
      </span>

    </div>


    <button
      id="activarCamara"
      type="button"
    >
      ACTIVAR CÁMARA
    </button>


    <div id="reader"></div>

    <div id="mensaje"></div>

  </div>


  <script>

    // ========================================================
    // CONFIGURACIÓN
    // ========================================================

    const URL_APP =
      "https://script.google.com/macros/s/AKfycbwqJQAoFyiz2GP7n05ATXvtPiCWChRzScyqCz3OlB1xmY14F5jKc8U898wcfZrZfQAMPQ/exec";

    const CLAVE =
      "P1-TEST-9264";


    let scanner = null;
    let procesando = false;
    let camaraIniciada = false;


    // ========================================================
    // ELEMENTOS
    // ========================================================

    const boton =
      document.getElementById("activarCamara");

    const reader =
      document.getElementById("reader");

    const mensaje =
      document.getElementById("mensaje");

    const estadoTexto =
      document.getElementById("estadoTexto");

    const estadoDetalle =
      document.getElementById("estadoDetalle");


    // ========================================================
    // PROTEGER TEXTO
    // ========================================================

    function escapar(texto) {

      return String(texto || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }


    // ========================================================
    // EXTRAER CÓDIGO DEL QR
    // ========================================================

    function obtenerCodigo(texto) {

      texto = String(texto || "").trim();

      if (!texto) {
        return "";
      }


      // Si el QR contiene una URL

      try {

        const url = new URL(texto);

        const codigo =
          url.searchParams.get("codigo");

        if (codigo) {
          return codigo.trim();
        }

      } catch (error) {

        // No es URL.
        // Se toma como código directo.

      }


      return texto;
    }


    // ========================================================
    // QR DETECTADO
    // ========================================================

    async function qrLeido(
      decodedText,
      decodedResult
    ) {

      if (procesando) {
        return;
      }


      const codigo =
        obtenerCodigo(decodedText);


      if (!codigo) {

        mensaje.innerHTML =
          "<span class='error'>" +
          "QR SIN CÓDIGO VÁLIDO" +
          "</span>";

        return;
      }


      procesando = true;


      estadoTexto.textContent =
        "QR DETECTADO";


      estadoDetalle.textContent =
        "Verificando invitación...";


      mensaje.innerHTML =
        "<span class='ok'>" +
        "Código: " +
        escapar(codigo) +
        "</span>";


      // ======================================================
      // DETENER CÁMARA ANTES DE SALIR
      // ======================================================

      try {

        if (scanner) {

          await scanner.stop();

        }

      } catch (error) {

        // Si no puede detenerla, continúa igual.

      }


      // ======================================================
      // ARMAR URL HACIA APPS SCRIPT
      // ======================================================

      const destino =
        URL_APP +
        "?codigo=" +
        encodeURIComponent(codigo) +
        "&clave=" +
        encodeURIComponent(CLAVE);


      // ======================================================
      // ABRIR CONTROL
      // ======================================================

      window.location.href = destino;
    }


    // ========================================================
    // ERROR NORMAL DE LECTURA
    // ========================================================

    function errorLectura(errorMessage) {

      // Se ignora.
      // El lector genera errores constantemente
      // mientras busca un QR.

    }


    // ========================================================
    // ACTIVAR CÁMARA
    // ========================================================

    async function activarCamara() {

      if (camaraIniciada) {
        return;
      }


      boton.disabled = true;

      boton.textContent =
        "ACTIVANDO CÁMARA...";


      estadoTexto.textContent =
        "INICIANDO CÁMARA";


      estadoDetalle.textContent =
        "Espere un momento...";


      mensaje.innerHTML = "";


      // ======================================================
      // COMPROBAR LIBRERÍA
      // ======================================================

      if (typeof Html5Qrcode === "undefined") {

        estadoTexto.textContent =
          "ERROR";


        estadoDetalle.textContent =
          "No se pudo cargar el lector QR.";


        mensaje.innerHTML =
          "<span class='error'>" +
          "Recargue la página e intente nuevamente." +
          "</span>";


        boton.disabled = false;

        boton.textContent =
          "REINTENTAR";


        return;
      }


      // ======================================================
      // MOSTRAR LECTOR
      // ======================================================

      reader.style.display =
        "block";


      try {

        scanner =
          new Html5Qrcode("reader");


        // ====================================================
        // CONFIGURACIÓN DE CÁMARA
        // ====================================================

        const configuracion = {

          fps: 10,

          qrbox: function(viewfinderWidth, viewfinderHeight) {

            const minimo =
              Math.min(
                viewfinderWidth,
                viewfinderHeight
              );


            const tamaño =
              Math.floor(
                minimo * 0.70
              );


            return {
              width: tamaño,
              height: tamaño
            };
          },

          aspectRatio: 1.0
        };


        // ====================================================
        // PEDIR CÁMARA TRASERA
        // ====================================================

        await scanner.start(

          {
            facingMode: {
              ideal: "environment"
            }
          },

          configuracion,

          qrLeido,

          errorLectura

        );


        // ====================================================
        // CÁMARA FUNCIONANDO
        // ====================================================

        camaraIniciada = true;


        estadoTexto.textContent =
          "CÁMARA ACTIVA";


        estadoDetalle.textContent =
          "Apunte al QR de la invitación.";


        boton.style.display =
          "none";


      } catch (error) {


        console.error(error);


        camaraIniciada = false;


        reader.style.display =
          "none";


        estadoTexto.textContent =
          "NO SE PUDO ABRIR LA CÁMARA";


        estadoDetalle.textContent =
          "Compruebe el permiso de cámara.";


        mensaje.innerHTML =
          "<span class='error'>" +
          escapar(
            error && error.message
              ? error.message
              : error
          ) +
          "</span>";


        boton.disabled = false;


        boton.textContent =
          "REINTENTAR CÁMARA";
      }
    }


    // ========================================================
    // BOTÓN
    // ========================================================

    boton.addEventListener(
      "click",
      activarCamara
    );


    // ========================================================
    // AL VOLVER DESDE APPS SCRIPT
    // ========================================================

    window.addEventListener(
      "pageshow",
      function () {

        procesando = false;

      }
    );

  </script>

</body>
</html>
